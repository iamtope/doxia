services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doxxia_users
    # REMOVED public port 5433:5432 for security
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    # Only expose management UI (15672) if you need it, but 5672 should be private
    ports:
      - "15672:15672"
    # REMOVED public port 5672:5672 for security

  redis:
    image: redis:7-alpine
    # REMOVED public port 6379:6379 for security

  user-service:
    build:
      context: ./user-service
    depends_on:
      - postgres
      - rabbitmq
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: doxxia_users
      JWT_SECRET: ${JWT_SECRET}
      TYPEORM_SYNC: "true"
      RABBITMQ_URL: amqp://rabbitmq:5672
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3002:3002"
    volumes:
      - ./user-service/src:/app/src
    command: ["npm", "run", "start:dev"]

  api-gateway:
    build:
      context: ./api-gateway
    depends_on:
      - user-service
    environment:
      USER_SERVICE_URL: http://user-service:3002/users
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3003:3003"
    volumes:
      - ./api-gateway/src:/app/src
    command: ["npm", "run", "start:dev"]

  scribe-service:
    build:
      context: ./scribe-service
    depends_on:
      - rabbitmq
      - redis
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Reliable --reload with bind mounts (Docker Desktop Mac/Windows)
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8001:8001"
    volumes:
      - ./scribe-service:/app
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--reload",
      ]

volumes:
  postgres_data:
